{% load static %}
<div class="lg:w-64 lg:shrink-0">
    <div x-show="mobileSidebar"
         x-transition.opacity
         @click="mobileSidebar = false"
         class="fixed inset-0 z-40 bg-slate-900/40 lg:hidden"
         style="display: none;"></div>

    <aside class="fixed inset-y-0 left-0 z-50 w-72 max-w-[85vw] transform border-r border-slate-100 bg-white shadow-xl transition-transform duration-200 lg:static lg:z-0 lg:flex lg:h-auto lg:min-h-0 lg:w-64 lg:max-w-none lg:translate-x-0 lg:border lg:shadow-sm"
           :class="mobileSidebar ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'"
           @click.stop>
        <div class="flex items-center justify-between border-b border-slate-100 px-4 py-3 lg:hidden">
            <span class="font-bold text-slate-900">Категории</span>
            <button type="button" class="rounded-lg p-2 text-slate-500 hover:bg-slate-100" @click="mobileSidebar = false" aria-label="Закрыть">
                <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>
        <nav class="max-h-[calc(100vh-4rem)] space-y-1 overflow-y-auto p-4 lg:max-h-none lg:sticky lg:top-28">
            <p class="mb-2 text-xs font-semibold uppercase tracking-wide text-slate-400">Канцтовары</p>
            <a href="{% url 'shop' %}" class="block rounded-lg px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50 hover:text-bazaar-red">Все товары</a>
            <a href="{% url 'shop' %}?categories=notebooks" class="block rounded-lg px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50 hover:text-bazaar-red">Тетради и блокноты</a>
            <a href="{% url 'shop' %}?categories=pens" class="block rounded-lg px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50 hover:text-bazaar-red">Ручки</a>
            <a href="{% url 'shop' %}?categories=papers" class="block rounded-lg px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50 hover:text-bazaar-red">Бумага</a>
            <a href="{% url 'shop' %}?categories=pencils" class="block rounded-lg px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50 hover:text-bazaar-red">Карандаши</a>
            <a href="{% url 'shop' %}?categories=art_materials" class="block rounded-lg px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50 hover:text-bazaar-red">Творчество</a>
            <a href="{% url 'shop' %}?categories=other" class="block rounded-lg px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50 hover:text-bazaar-red">Прочее</a>
            <hr class="my-4 border-slate-100">
            <p class="mb-2 text-xs font-semibold uppercase tracking-wide text-slate-400">Информация</p>
            <a href="{% url 'about-us' %}" class="block rounded-lg px-3 py-2 text-sm text-slate-600 hover:bg-slate-50">О магазине</a>
            <a href="{% url 'contact-us' %}" class="block rounded-lg px-3 py-2 text-sm text-slate-600 hover:bg-slate-50">Контакты</a>
        </nav>
    </aside>
</div>
