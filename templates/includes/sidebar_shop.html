<div class="shop-sidebar">
    <div x-show="mobileCatalog"
         x-transition.opacity
         @click="mobileCatalog = false"
         class="shop-sidebar__backdrop"
         style="display: none;"></div>

    {{ catalog_categories_nav|json_script:"catalog-nav-sidebar-initial" }}
    {{ selected_category_slugs|json_script:"catalog-sidebar-selected" }}

    <aside class="shop-sidebar__panel shop-sidebar__panel--floating shop-sidebar__panel--catalog"
           :class="{ 'is-open': mobileCatalog }"
           @click.stop>
        <div class="shop-sidebar__head">
            <span class="shop-sidebar__head-title">Категории</span>
            <button type="button" class="icon-btn hide-desktop" @click="mobileCatalog = false" aria-label="Закрыть">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>
        <nav class="shop-sidebar__nav"
             x-data="catalogSidebarNav({
               shopUrl: '{% url 'shop' %}',
               searchUrl: '{% url 'categories-search-api' %}',
             })">
            <div class="shop-sidebar__search">
                <label class="sr-only">Поиск по каталогу</label>
                <div class="shop-sidebar__search-row">
                    <input type="search"
                           class="shop-sidebar__search-input"
                           aria-label="Поиск по каталогу"
                           x-model="catalogQuery"
                           placeholder="Поиск по категориям…"
                           autocomplete="off"
                           @input="scheduleSearch()"
                           @keydown.enter.prevent="goShopSearch()">
                    <button type="button"
                            class="shop-sidebar__search-go"
                            @click="goShopSearch()"
                            title="Искать товары в каталоге">Найти</button>
                </div>
                <p class="shop-sidebar__search-hint" x-show="loading" x-cloak>Загрузка…</p>
            </div>

            <p class="shop-sidebar__section-label">Каталог</p>
            <a href="{% url 'shop' %}"
               class="shop-sidebar__link shop-sidebar__link--with-icon {% if request.path == '/shop/' and not selected_category_slugs %}is-active{% endif %}"
               {% if request.resolver_match and request.resolver_match.url_name == 'shop' %}
               hx-get="{% url 'shop_grid' %}"
               hx-include="#shop-filters"
               hx-target="#product-grid"
               hx-swap="outerHTML"
               hx-indicator="#product-grid-skeleton"
               hx-push-url="{% url 'shop' %}"
               data-shop-category-nav
               {% endif %}>
                <span class="shop-sidebar__cat-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 0 1 6 3.75h2.25A2.25 2.25 0 0 1 10.5 6v2.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6Zm0 9.75A2.25 2.25 0 0 1 6 13.5h2.25a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25H6A2.25 2.25 0 0 1 3.75 18v-2.25ZM13.5 6a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 20.25 6v2.25A2.25 2.25 0 0 1 18 10.5h-2.25A2.25 2.25 0 0 1 13.5 8.25V6Zm0 9.75a2.25 2.25 0 0 1 2.25-2.25H18a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25h-2.25A2.25 2.25 0 0 1 13.5 18v-2.25Z"/></svg></span>
                <span>Все товары</span>
            </a>

            <template x-for="cat in categories" :key="cat.slug">
                <div class="shop-sidebar__cat">
                    <div class="shop-sidebar__cat-row">
                        <a href="{% url 'shop' %}"
                           x-bind:href="shopUrl + '?categories=' + encodeURIComponent(cat.slug)"
                           class="shop-sidebar__link shop-sidebar__link--with-icon"
                           :class="{ 'is-active': isActive(cat.slug) }"
                           {% if request.resolver_match and request.resolver_match.url_name == 'shop' %}
                           hx-get="{% url 'shop_grid' %}"
                           hx-include="#shop-filters"
                           hx-target="#product-grid"
                           hx-swap="outerHTML"
                           hx-indicator="#product-grid-skeleton"
                           :hx-vals="JSON.stringify({ categories: cat.slug })"
                           :hx-push-url="shopUrl + '?categories=' + encodeURIComponent(cat.slug)"
                           data-shop-category-nav
                           {% endif %}>
                            <span class="shop-sidebar__cat-icon" aria-hidden="true" x-html="iconSvgFor(cat)"></span>
                            <span x-text="cat.name"></span>
                        </a>
                        <button type="button"
                                class="shop-sidebar__cat-toggle"
                                x-show="(cat.subs || []).length > 0"
                                style="display: none;"
                                @click="openCats[cat.slug] = !openCats[cat.slug]"
                                :aria-expanded="openCats[cat.slug] ? 'true' : 'false'"
                                aria-label="Подкатегории">
                            <svg width="16" height="16" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" :class="openCats[cat.slug] ? 'rotate-180' : ''" style="transition:transform 0.2s">
                                <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5"/>
                            </svg>
                        </button>
                    </div>

                    <div class="shop-sidebar__subs"
                         x-show="(cat.subs || []).length > 0 && (openCats[cat.slug] || catalogQuery.trim())"
                         x-transition
                         style="display: none;">
                        <template x-for="sub in cat.subs" :key="sub.slug">
                            <a href="{% url 'shop' %}"
                               x-bind:href="shopUrl + '?categories=' + encodeURIComponent(sub.slug)"
                               class="shop-sidebar__sublink"
                               :class="{ 'is-active': isActive(sub.slug) }"
                               {% if request.resolver_match and request.resolver_match.url_name == 'shop' %}
                               hx-get="{% url 'shop_grid' %}"
                               hx-include="#shop-filters"
                               hx-target="#product-grid"
                               hx-swap="outerHTML"
                               hx-indicator="#product-grid-skeleton"
                               :hx-vals="JSON.stringify({ categories: sub.slug })"
                               :hx-push-url="shopUrl + '?categories=' + encodeURIComponent(sub.slug)"
                               data-shop-category-nav
                               {% endif %}>
                                <span x-text="'— ' + sub.name"></span>
                            </a>
                        </template>
                    </div>
                </div>
            </template>

            <p x-show="!loading && categories.length === 0 && catalogQuery.trim()"
               x-cloak
               class="cat-dropdown__empty">Ничего не найдено.</p>
            <p x-show="!loading && categories.length === 0 && !catalogQuery.trim()"
               x-cloak
               class="cat-dropdown__empty">Нет категорий в базе.</p>

        </nav>
    </aside>
</div>
