[pytest]
DJANGO_SETTINGS_MODULE = magnat_trade_project.settings
python_files = test_*.py
testpaths = tests
addopts = -ra --reuse-db -m "not integration"
markers =
    integration: live HTTP tests (1C API, etc.); run with pytest -m integration
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
