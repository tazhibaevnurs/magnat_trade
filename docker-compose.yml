services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-magnat_trade}
      POSTGRES_USER: ${POSTGRES_USER:-magnat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-magnat}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-magnat} -d ${POSTGRES_DB:-magnat_trade}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    build: .
    command: gunicorn magnat_trade_project.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "false"
      DATABASE_URL: ${DATABASE_URL:-postgresql://magnat:magnat@db:5432/magnat_trade}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    # Внешний порт хоста → Gunicorn внутри контейнера всегда :8000.
    # На VPS без nginx: WEB_PUBLISH_PORT=80 в .env → сайт по http://IP без :8000
    ports:
      - "${WEB_PUBLISH_PORT:-8000}:8000"
    volumes:
      - media_data:/app/media
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery:
    build: .
    command: celery -A magnat_trade_project worker -l info
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "false"
      DATABASE_URL: ${DATABASE_URL:-postgresql://magnat:magnat@db:5432/magnat_trade}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - media_data:/app/media
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery-beat:
    build: .
    command: celery -A magnat_trade_project beat -l info
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "false"
      DATABASE_URL: ${DATABASE_URL:-postgresql://magnat:magnat@db:5432/magnat_trade}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pg_data:
  media_data:
